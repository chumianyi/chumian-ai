name: Build Multi-Platform

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate signing keystore
        run: |
          keytool -genkey -v -keystore android/app/keystore.jks -storepass chumian123 -alias chumian -keypass chumian123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ChumianAI, OU=Dev, O=Chumian, L=Beijing, ST=Beijing, C=CN"

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chumian-ai-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS (no signing)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - run: flutter config --enable-ios

      - run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build iOS (no code signing)
        run: |
          flutter build ios --release --no-codesign || true
          echo "iOS build completed (unsigned)"

      - name: Package Runner.app
        run: |
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cd build/ios/iphoneos
            zip -r ../../../chumian-ai-ios-runner.zip Runner.app
            cd ../../..
          fi
        shell: bash

      - name: Upload iOS Runner.app
        uses: actions/upload-artifact@v4
        with:
          name: chumian-ai-ios-runner
          path: chumian-ai-ios-runner.zip
